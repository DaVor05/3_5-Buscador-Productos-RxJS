<section class="search-toolbar" *ngIf="productService.filteredProducts$ | async as productsList">
  <div class="toolbar-controls">
    <input
      type="text"
      [formControl]="searchControl"
      placeholder="Buscar producto por nombre..."
      class="toolbar-input"
    />

    <select [formControl]="categoryControl" class="toolbar-select">
      <option value="All">Todas las Categorías</option>
      <option value="Muebles">Muebles</option>
      <option value="Accesorios">Accesorios</option>
      <option value="Calzado">Calzado</option>
      <option value="Electrónica">Electrónica</option>
      <option value="Bolsos">Bolsos</option>
    </select>

    <select [formControl]="sortControl" class="toolbar-select">
      <option value="none">Ordenar por precio</option>
      <option value="asc">Precio: menor a mayor</option>
      <option value="desc">Precio: mayor a menor</option>
    </select>
  </div>

  <div class="toolbar-count">
    Mostrando <strong>{{ productsList.length }}</strong> productos
  </div>
</section>
